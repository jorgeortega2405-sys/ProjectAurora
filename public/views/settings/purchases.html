<div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="purchases-wrapper">
  <header class="component-top" data-ref="component-top">
    <div class="component-top-left" data-ref="component-top-left">
      <h1 class="component-top-title" data-ref="purchases-page-title" style="font-size: 15px; font-weight: 700;">Historial de Compras</h1>
      <span class="component-badge component-badge--sm" data-ref="purchases-count-badge">0</span>
    </div>

    <div class="component-top-right" data-ref="component-top-right">
      <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-toggle-search" data-tooltip="Buscar compras" data-tooltip-placement="bottom" aria-label="Buscar compras">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
      </button>
    </div>

    <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
      <div class="component-search component-search--full" data-ref="search-box">
        <div class="component-search__icon" data-ref="search-icon">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
        </div>
        <div class="component-search__input-box" data-ref="search-input-box">
          <input class="component-search__input" data-ref="purchases-search-input" placeholder="Buscar por plan, referencia o monto..." type="text" maxlength="100" autocomplete="off" />
        </div>
        <button type="button" class="component-button component-button--h34 component-button--icon-only" data-ref="btn-clear-search" aria-label="Limpiar búsqueda" style="display: none; margin-right: 4px;">
          <svg class="component-icon" aria-hidden="true" style="width: 16px; height: 16px;"><use href="/icons.svg#close"></use></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
    <div class="component-table-wrapper" data-ref="purchases-table-wrapper">
      <table class="component-table" data-ref="purchases-table">
        <thead class="component-table__head" data-ref="purchases-thead">
          <tr>
            <th data-ref="th-plan">Plan / Concepto</th>
            <th data-ref="th-amount">Monto</th>
            <th data-ref="th-period">Ciclo</th>
            <th data-ref="th-status">Estado</th>
            <th data-ref="th-date">Fecha de pago</th>
            <th class="text-right" data-ref="th-reference">Referencia</th>
          </tr>
        </thead>
        <tbody class="component-table__body" data-ref="purchases-tbody">
          <tr>
            <td colspan="6" style="text-align: center; padding: 32px; color: var(--text-secondary);">Cargando historial de compras...</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="banner banner--danger" data-ref="purchases-page-error" style="display: none; margin: 12px 24px;"></div>
  </div>
</div>
