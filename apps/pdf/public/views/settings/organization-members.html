<div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="org-members-wrapper">
  <header class="component-top" data-ref="component-top">
    <div class="component-top-left" data-ref="component-top-left">
      <h1 class="component-top-title" data-ref="members-page-title" style="font-size: 15px; font-weight: 700;">Miembros de la Organización</h1>
      <span class="component-badge component-badge--sm" data-ref="members-count-badge">0</span>
    </div>

    <div class="component-top-right" data-ref="component-top-right">
      <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-open-invite-modal" data-tooltip="Invitar miembro" data-tooltip-placement="bottom" aria-label="Invitar miembro">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#add"></use></svg>
      </button>
    </div>
  </header>

  <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
    <div class="component-table-wrapper" data-ref="members-table-wrapper">
      <table class="component-table" data-ref="members-table">
        <thead class="component-table__head" data-ref="members-thead">
          <tr>
            <th data-ref="th-user">Usuario</th>
            <th data-ref="th-role">Rol</th>
            <th data-ref="th-status">Estado</th>
            <th data-ref="th-date">Fecha de ingreso</th>
            <th class="text-right" data-ref="th-actions">Acciones</th>
          </tr>
        </thead>
        <tbody class="component-table__body" data-ref="members-table-body">
          <tr>
            <td colspan="5" style="text-align: center; padding: 32px; color: var(--text-secondary);">Cargando miembros del equipo...</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="banner banner--danger" data-ref="members-page-error" style="display: none; margin: 12px 24px;"></div>
  </div>

  <div class="modal-backdrop" data-ref="modal-invite" style="display: none;">
    <div class="modal-container" data-ref="modal-invite-container">
      <button type="button" class="modal-close-btn" data-ref="btn-close-invite-modal" aria-label="Cerrar modal">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
      </button>

      <div class="modal-card modal-card--w-480" data-ref="card-modal-invite">
        <div class="modal-card__drag-zone" data-ref="modal-invite-drag-zone" aria-hidden="true">
          <div class="modal-card__drag-handle"></div>
        </div>

        <div class="modal-card__header" data-ref="header-modal-invite">
          <h2 class="modal-card__title" data-ref="title-modal-invite">Invitar a un nuevo miembro</h2>
          <p class="modal-card__desc" data-ref="desc-modal-invite">Agrega colegas a tu organización corporativa consumiendo un asiento disponible.</p>
        </div>

        <div class="modal-card__body" data-ref="body-modal-invite">
          <form class="org-invite-form" data-ref="form-invite-member" style="display: flex; flex-direction: column; gap: 14px;">
            <label class="field" data-ref="field-invite-email">
              <input class="field__input" data-ref="input-invite-email" type="email" placeholder=" " autocomplete="email" required />
              <span class="field__label" data-ref="label-invite-email">Correo electrónico corporativo</span>
            </label>

            <div class="dropdown-wrapper dropdown-wrapper--full" data-ref="dropdown-wrapper-invite-role">
              <button type="button" class="dropdown-trigger dropdown-trigger--full" data-ref="btn-trigger-invite-role" aria-label="Rol asignado">
                <div class="dropdown-trigger__left">
                  <span class="dropdown-trigger__text" data-ref="txt-selected-invite-role">Miembro (Acceso a herramientas)</span>
                </div>
                <svg class="component-icon dropdown-trigger__chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
              </button>
              <div class="dropdown-backdrop" data-ref="backdrop-invite-role">
                <div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" data-ref="menu-invite-role">
                  <div class="menu-panel__list" data-ref="list-invite-role">
                    <button type="button" class="menu-item is-active" data-ref="opt-invite-role-member" data-value="ORG_MEMBER">
                      <span class="menu-item__text">Miembro (Acceso a herramientas)</span>
                    </button>
                    <button type="button" class="menu-item" data-ref="opt-invite-role-admin" data-value="ORG_ADMIN">
                      <span class="menu-item__text">Administrador (Gestión de equipo)</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="modal-card__actions" data-ref="modal-invite-actions" style="margin-top: 6px;">
              <button type="submit" class="component-button component-button--h44 component-button--black component-button--w-full" data-ref="btn-submit-invite">
                Enviar invitación
              </button>
            </div>
          </form>

          <div class="banner banner--danger" data-ref="invite-member-error" style="display: none; margin-top: 12px;"></div>
          <div class="banner banner--success" data-ref="invite-member-success" style="display: none; margin-top: 12px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
