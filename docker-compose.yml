services:
  mysql:
    image: mysql:8.0
    container_name: aurora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: db_aurora
      MYSQL_USER: aurora_user
      MYSQL_PASSWORD: aurora_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/db_identity.sql:/docker-entrypoint-initdb.d/01_db_identity.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: aurora-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  downloader:
    build:
      context: ./docker/downloader
      dockerfile: Dockerfile
    container_name: aurora-downloader
    restart: unless-stopped
    ports:
      - "127.0.0.1:4050:4050"
    environment:
      - PORT=4050
    volumes:
      - downloader-data:/app/downloads

  app:
    build: .
    container_name: aurora-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=aurora_user
      - DB_PASSWORD=aurora_password
      - DB_NAME=db_aurora
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOWNLOADER_SERVICE_URL=http://downloader:4050
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      downloader:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  downloader-data:
  uploads_data:
