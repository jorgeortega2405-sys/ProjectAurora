<div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="settings-wrapper">
  <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="settings-scrollable">
    <div class="settings-layout" data-ref="settings-layout">
      <div class="settings-header" data-ref="settings-header">
        <h1 class="settings-title" data-ref="settings-title" data-i18n="settings.security.title"></h1>
        <p class="settings-subtitle" data-ref="settings-subtitle" data-i18n="settings.security.subtitle"></p>
      </div>

      <div class="banner banner--info" data-ref="protected-account-banner" style="display: none; margin-bottom: 24px;">
        <span class="material-symbols-rounded">shield</span>
        <div class="banner__text">
          <strong data-i18n="settings.security.account_protected_banner_title"></strong>
          <span data-i18n="settings.security.account_protected_banner_desc"></span>
        </div>
      </div>

      <div class="settings-group" data-ref="group-auth-methods">
        <div class="settings-item" data-ref="item-password">
          <div class="settings-item__content" data-ref="item-password-content">
            <div class="settings-item__icon-box" data-ref="item-password-icon-box">
              <span class="material-symbols-rounded">lock</span>
            </div>
            <div class="settings-item__text" data-ref="item-password-text">
              <h2 class="settings-item__title" data-ref="item-password-title" data-i18n="settings.security.password_title"></h2>
              <p class="settings-item__desc" data-ref="item-password-desc" data-i18n="settings.security.password_desc"></p>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="item-password-actions">
            <button type="button" class="component-button component-button--h34" data-ref="btn-change-password" data-i18n="settings.security.btn_change_password"></button>
          </div>
        </div>

        <hr class="settings-divider" />

        <div class="settings-item" data-ref="item-2fa">
          <div class="settings-item__content" data-ref="item-2fa-content">
            <div class="settings-item__icon-box" data-ref="item-2fa-icon-box">
              <span class="material-symbols-rounded">shield</span>
            </div>
            <div class="settings-item__text" data-ref="item-2fa-text">
              <h2 class="settings-item__title" data-ref="item-2fa-title" data-i18n="settings.security.two_factor_title"></h2>
              <p class="settings-item__desc" data-ref="item-2fa-desc" data-i18n="settings.security.two_factor_desc"></p>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="item-2fa-actions">
            <button type="button" class="component-button component-button--h34 component-button--black" data-ref="btn-configure-2fa" data-i18n="settings.security.btn_configure_2fa"></button>
          </div>
        </div>
      </div>

      <div class="settings-group" data-ref="group-sessions-management">
        <div class="settings-item" data-ref="item-logout-all">
          <div class="settings-item__content" data-ref="item-logout-all-content">
            <div class="settings-item__icon-box" data-ref="item-logout-all-icon-box">
              <span class="material-symbols-rounded">devices</span>
            </div>
            <div class="settings-item__text" data-ref="item-logout-all-text">
              <h2 class="settings-item__title" data-ref="item-logout-all-title" data-i18n="settings.security.logout_all_title"></h2>
              <p class="settings-item__desc" data-ref="item-logout-all-desc" data-i18n="settings.security.logout_all_desc"></p>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="item-logout-all-actions">
            <button type="button" class="component-button component-button--h34 component-button--danger" data-ref="btn-logout-all-devices" data-i18n="settings.security.btn_logout_all"></button>
          </div>
        </div>
      </div>

      <div class="settings-group" data-ref="group-danger-zone">
        <div class="settings-item" data-ref="item-delete-account">
          <div class="settings-item__content" data-ref="item-delete-account-content">
            <div class="settings-item__text" data-ref="item-delete-account-text">
              <h2 class="settings-item__title" data-ref="item-delete-account-title" data-i18n="settings.security.delete_account_title"></h2>
              <p class="settings-item__desc" data-ref="item-delete-account-desc" data-i18n="settings.security.delete_account_desc"></p>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="item-delete-account-actions">
            <button type="button" class="component-button component-button--h34 component-button--danger" data-ref="btn-delete-account" data-i18n="settings.security.btn_delete_account"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
