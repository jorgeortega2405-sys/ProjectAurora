<div class="login-container" data-ref="forgot-wrapper">
  <a class="login-header-logo" data-ref="forgot-home-link" href="/" data-i18n-aria="nav.go_home" data-i18n-title="app.name">
    <svg class="component-icon" style="width: 28px; height: 28px;" aria-hidden="true"><use href="/icons.svg#auto_awesome"></use></svg>
    <span style="font-weight: 700; font-size: 18px; color: var(--text-primary); letter-spacing: -0.3px;">ProjectAurora</span>
  </a>

  <div class="card card--w-400" data-ref="forgot-card">
    <div class="card__header" data-ref="forgot-header">
      <h1 class="card__title" data-ref="forgot-title" data-i18n="auth.forgot_password.title">¿Olvidaste tu contraseña?</h1>
      <p class="card__subtitle" data-ref="forgot-subtitle" data-i18n="auth.forgot_password.subtitle">Ingresa tu correo electrónico para enviarte las instrucciones de recuperación</p>
    </div>

    <div class="card__body" data-ref="forgot-form">
      <label class="field" data-ref="field-forgot-email">
        <input class="field__input" data-ref="forgot-email" type="email" maxlength="254" placeholder=" " autocomplete="email" />
        <span class="field__label" data-ref="label-forgot-email" data-i18n="auth.forgot_password.email_label">Correo electrónico</span>
      </label>

      <div class="turnstile-container" data-ref="turnstile-forgot-container"></div>

      <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-forgot" data-i18n="auth.forgot_password.submit_btn">
        Continuar
      </button>

      <div class="banner banner--danger" data-ref="forgot-error" style="display: none;"></div>
      <div class="banner banner--success" data-ref="forgot-success" style="display: none;"></div>

      <p class="footer-note" data-ref="forgot-footer">
        <span data-i18n="auth.forgot_password.remembered">¿Recordaste tu contraseña?</span> <a class="link link--primary" data-ref="btn-forgot-to-login" href="/login" data-i18n="auth.forgot_password.login_link">Iniciar sesión</a>
      </p>
    </div>
  </div>
</div>
