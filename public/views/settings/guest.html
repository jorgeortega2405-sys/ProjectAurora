<div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="settings-wrapper">
    <div class="layout-body layout-body--scrollable layout-scrollable view-scrollable" data-ref="settings-scrollable">
      <div class="settings-layout" data-ref="settings-layout">
      <div class="settings-header" data-ref="settings-header">
        <h1 class="settings-title" data-ref="settings-title" data-i18n="settings.guest.title"></h1>
        <p class="settings-subtitle" data-ref="settings-subtitle" data-i18n="settings.guest.subtitle"></p>
      </div>

      <!-- Grupo 1: Preferencias generales -->
      <div class="settings-group" data-ref="group-guest-preferences">
        <!-- Item: Idioma -->
        <div class="settings-item settings-item--stacked" data-ref="item-guest-language">
          <div class="settings-item__content" data-ref="item-guest-language-content">
            <div class="settings-item__text" data-ref="item-guest-language-text">
              <h2 class="settings-item__title" data-ref="item-guest-language-title" data-i18n="settings.guest.language_title"></h2>
              <p class="settings-item__desc" data-ref="item-guest-language-desc" data-i18n="settings.guest.language_desc"></p>
            </div>
          </div>
          <div class="settings-dropdown-wrapper" data-ref="dropdown-wrapper-guest-language">
            <button type="button" class="dropdown-trigger" data-ref="btn-trigger-guest-language" data-i18n-aria="settings.guest.language_trigger_aria">
              <div class="dropdown-trigger__left">
                <svg class="component-icon dropdown-trigger__icon" aria-hidden="true"><use href="/icons.svg#language"></use></svg>
                <span class="dropdown-trigger__text" data-ref="guest-language-selected-text"></span>
              </div>
              <svg class="component-icon dropdown-trigger__chevron" aria-hidden="true"><use href="/icons.svg#expand_more"></use></svg>
            </button>

            <div class="dropdown-backdrop" data-ref="dropdown-backdrop-guest-language">
              <div class="menu-panel menu-panel--dropdown menu-panel--w-full menu-panel--h-auto" data-ref="dropdown-menu-guest-language">
                <div class="menu-panel__drag-zone" data-ref="drag-zone-guest-language" aria-hidden="true">
                  <div class="menu-panel__drag-handle"></div>
                </div>
                <div class="menu-panel__search" data-ref="search-wrapper-guest-language">
                  <svg class="component-icon menu-panel__search-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
                  <input class="menu-panel__search-input" data-ref="input-search-guest-language" data-i18n-placeholder="settings.guest.search_language_placeholder" type="text" maxlength="50" autocomplete="off" />
                </div>
                <div class="menu-panel__list menu-panel__list--scrollable" data-ref="list-guest-languages">
                  <!-- Opciones de idiomas renderizadas dinámicamente -->
                </div>
                <div class="menu-panel__empty" data-ref="empty-guest-languages" data-i18n="settings.guest.no_languages_found" style="display: none;">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Grupo 2: Accesibilidad e interacción local -->
      <div class="settings-group" data-ref="group-guest-accessibility">
        <!-- Item: Reducir animaciones -->
        <div class="settings-item" data-ref="item-guest-reduce-motion">
          <div class="settings-item__content" data-ref="item-guest-reduce-motion-content">
            <div class="settings-item__text" data-ref="item-guest-reduce-motion-text">
              <h2 class="settings-item__title" data-ref="item-guest-reduce-motion-title" data-i18n="settings.guest.reduce_motion_title"></h2>
              <p class="settings-item__desc" data-ref="item-guest-reduce-motion-desc" data-i18n="settings.guest.reduce_motion_desc"></p>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="item-guest-reduce-motion-actions">
            <label class="toggle-switch" data-ref="label-toggle-guest-reduce-motion">
              <input class="toggle-switch__input" data-ref="toggle-guest-reduce-motion" type="checkbox" />
              <span class="toggle-switch__slider"></span>
            </label>
          </div>
        </div>

        <hr class="settings-divider" />

        <!-- Item: Alto contraste -->
        <div class="settings-item" data-ref="item-guest-high-contrast">
          <div class="settings-item__content" data-ref="item-guest-high-contrast-content">
            <div class="settings-item__text" data-ref="item-guest-high-contrast-text">
              <h2 class="settings-item__title" data-ref="item-guest-high-contrast-title" data-i18n="settings.guest.high_contrast_title"></h2>
              <p class="settings-item__desc" data-ref="item-guest-high-contrast-desc" data-i18n="settings.guest.high_contrast_desc"></p>
            </div>
          </div>
          <div class="settings-item__actions" data-ref="item-guest-high-contrast-actions">
            <label class="toggle-switch" data-ref="label-toggle-guest-high-contrast">
              <input class="toggle-switch__input" data-ref="toggle-guest-high-contrast" type="checkbox" />
              <span class="toggle-switch__slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
