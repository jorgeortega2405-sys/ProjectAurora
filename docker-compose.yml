services:
  mysql:
    image: mysql:8.0
    container_name: aurora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: db_aurora
      MYSQL_USER: aurora_user
      MYSQL_PASSWORD: aurora_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/db_identity.sql:/docker-entrypoint-initdb.d/01_db_identity.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: aurora-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  downloader:
    build:
      context: ./docker/downloader
      dockerfile: Dockerfile
    container_name: aurora-downloader
    restart: unless-stopped
    ports:
      - "127.0.0.1:4050:4050"
    environment:
      - PORT=4050
    volumes:
      - downloader-data:/app/downloads

  websocket:
    build:
      context: ./services/aurora-ws
      dockerfile: Dockerfile
    container_name: aurora-websocket
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: aurora-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"

  telemetry-worker:
    build:
      context: ./services/telemetry-worker
      dockerfile: Dockerfile
    container_name: aurora-telemetry-worker
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_QUEUE=telemetry:queue:incoming
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=aurora_telemetry
      - BATCH_SIZE=100
      - BATCH_TIMEOUT_SECONDS=2.0
    depends_on:
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy

  cassandra:
    image: cassandra:4.1
    container_name: aurora-cassandra
    restart: unless-stopped
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=aurora_cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./database/cassandra/init_telemetry.cql:/docker-entrypoint-initdb.d/init_telemetry.cql:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 40s

  pdf:
    build:
      context: ./apps/pdf
    container_name: aurora-pdf
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./apps/pdf/.env
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=aurora_user
      - DB_PASSWORD=aurora_password
      - DB_NAME=db_aurora
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=aurora-storage
      - S3_FORCE_PATH_STYLE=true
      - DOWNLOADER_SERVICE_URL=http://downloader:4050
    volumes:
      - uploads_data:/app/public/uploads
      - temp_storage_data:/app/temp_storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      downloader:
        condition: service_started
      websocket:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aurora-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - tunnel

volumes:
  cassandra_data:
  mysql_data:
  redis_data:
  downloader-data:
  uploads_data:
  temp_storage_data:
