<div class="login-container" data-ref="reset-wrapper">
  <a class="login-header-logo" data-ref="reset-home-link" href="/" data-i18n-aria="nav.go_home" data-i18n-title="app.name">
    <svg class="component-icon" style="width: 28px; height: 28px;" aria-hidden="true"><use href="/icons.svg#auto_awesome"></use></svg>
    <span style="font-weight: 700; font-size: 18px; color: var(--text-primary); letter-spacing: -0.3px;">ProjectAurora</span>
  </a>

  <div class="card card--w-400" data-ref="reset-card">
    <div class="card__header" data-ref="reset-header">
      <h1 class="card__title" data-ref="reset-title" data-i18n="auth.reset_password.title">Restablecer contraseña</h1>
      <p class="card__subtitle" data-ref="reset-subtitle" data-i18n="auth.reset_password.subtitle">Elige una nueva contraseña segura para tu cuenta</p>
    </div>

    <div class="card__body" data-ref="reset-form">
      <label class="field" data-ref="field-reset-password">
        <input class="field__input field__input--has-action" data-ref="reset-password" type="password" maxlength="128" placeholder=" " autocomplete="new-password" />
        <span class="field__label" data-ref="label-reset-password" data-i18n="auth.reset_password.new_password_label">Nueva contraseña</span>
        <button type="button" class="field__action" data-ref="toggle-reset-password" data-i18n-tooltip="auth.login.show_password" data-i18n-aria="auth.login.toggle_password">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#visibility"></use></svg>
        </button>
      </label>

      <label class="field" data-ref="field-reset-password-confirm">
        <input class="field__input field__input--has-action" data-ref="reset-password-confirm" type="password" maxlength="128" placeholder=" " autocomplete="new-password" />
        <span class="field__label" data-ref="label-reset-password-confirm" data-i18n="auth.reset_password.confirm_password_label">Confirmar nueva contraseña</span>
        <button type="button" class="field__action" data-ref="toggle-reset-password-confirm" data-i18n-tooltip="auth.login.show_password" data-i18n-aria="auth.login.toggle_password">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#visibility"></use></svg>
        </button>
      </label>

      <div class="turnstile-container" data-ref="turnstile-reset-container"></div>

      <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-reset" data-i18n="auth.reset_password.submit_btn">
        Restablecer contraseña
      </button>

      <div class="banner banner--danger" data-ref="reset-error" style="display: none;"></div>
      <div class="banner banner--success" data-ref="reset-success" style="display: none;"></div>

      <p class="footer-note" data-ref="reset-footer">
        <span data-i18n="auth.reset_password.remembered">¿Recordaste tu contraseña?</span> <a class="link link--primary" data-ref="btn-reset-to-login" href="/login" data-i18n="auth.reset_password.login_link">Iniciar sesión</a>
      </p>
    </div>
  </div>
</div>
