[package]
name = "aurora-ws"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3"
redis = { version = "0.25", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
