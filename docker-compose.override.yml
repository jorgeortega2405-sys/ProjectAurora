services:
  pdf:
    command: npm run dev
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=aurora_user
      - DB_PASSWORD=aurora_password
      - DB_NAME=db_aurora
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOWNLOADER_SERVICE_URL=http://downloader:4050
    volumes:
      - ./apps/pdf:/app
      - /app/node_modules
      - /app/dist
