<div class="login-container" data-ref="admin-login-wrapper">
  <div class="card card--w-400" data-ref="admin-login-card">
    <div class="card__header" data-ref="admin-login-header">
      <div class="badge-role badge-role--admin" data-ref="admin-login-badge" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(var(--primary-rgb, 14, 165, 233), 0.12); color: var(--primary, #0ea5e9); font-size: 12px; font-weight: 600; margin-bottom: 12px; width: fit-content;">
        <svg class="component-icon" style="width: 14px; height: 14px;" aria-hidden="true"><use href="/icons.svg#shield"></use></svg>
        <span>Acceso Administrativo</span>
      </div>
      <h1 class="card__title" data-ref="admin-login-title">Iniciar Sesión</h1>
      <p class="card__subtitle" data-ref="admin-login-subtitle">Ingresa tus credenciales autorizadas para acceder a la consola de administración.</p>
    </div>

    <div class="card__body" data-ref="admin-login-form">
      <label class="field" data-ref="field-admin-email">
        <input class="field__input" data-ref="admin-login-email" type="text" maxlength="254" placeholder=" " autocomplete="username" />
        <span class="field__label" data-ref="label-admin-email">Correo o nombre de usuario</span>
      </label>

      <label class="field" data-ref="field-admin-password">
        <input class="field__input field__input--has-action" data-ref="admin-login-password" type="password" maxlength="128" placeholder=" " autocomplete="current-password" />
        <span class="field__label" data-ref="label-admin-password">Contraseña</span>
        <button type="button" class="field__action" data-ref="btn-toggle-admin-password" data-tooltip="Mostrar contraseña" aria-label="Mostrar contraseña">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#visibility"></use></svg>
        </button>
      </label>

      <button type="button" class="component-button component-button--h55 component-button--black component-button--w-full" data-ref="btn-submit-admin-login">
        Acceder al Panel
      </button>

      <button type="button" class="component-button component-button--outline component-button--w-full" data-ref="btn-cancel-admin-login" style="display: none; margin-top: 10px;">
        Volver al Panel
      </button>

      <div class="banner banner--danger" data-ref="admin-login-error" style="display: none; margin-top: 14px;"></div>

      <div class="footer-note" data-ref="admin-login-security-notice" style="margin-top: 20px; font-size: 12px; color: var(--text-secondary); text-align: center; line-height: 1.5;">
        <span>Este portal es de uso exclusivo y monitoreado. Todos los intentos de acceso quedan registrados en el sistema de auditoría.</span>
      </div>
    </div>
  </div>
</div>
