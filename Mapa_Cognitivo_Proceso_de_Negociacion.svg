<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1050" width="1680" height="1050">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Fondo Blanco -->
  <rect width="1680" height="1050" fill="#ffffff" />

  <!-- Contenedor Principal Centrado -->
  <g transform="translate(40, 75)">

    <!-- ==============================================
         LÍNEAS CONECTORAS SVG
         ============================================== -->
    <g fill="none" stroke-linecap="round">
      <!-- Centro a Izquierda (Etapas 1 y 4) -->
      <path d="M 695 450 H 645 Q 620 450 620 425 V 258 Q 620 233 596 233" stroke="#1e293b" stroke-width="2.5" />
      <path d="M 695 450 H 645 Q 620 450 620 475 V 642 Q 620 667 596 667" stroke="#1e293b" stroke-width="2.5" />

      <!-- Centro a Derecha (Etapas 2 y 3) -->
      <path d="M 905 450 H 955 Q 980 450 980 425 V 258 Q 980 233 1004 233" stroke="#1e293b" stroke-width="2.5" />
      <path d="M 905 450 H 955 Q 980 450 980 475 V 642 Q 980 667 1004 667" stroke="#1e293b" stroke-width="2.5" />

      <!-- ETAPA 1 a Leaves -->
      <path d="M 390 233 H 360" stroke="#475569" stroke-width="2" />
      <path d="M 360 60 V 342" stroke="#475569" stroke-width="2" />
      <path d="M 360 60 H 330" stroke="#475569" stroke-width="2" />
      <path d="M 360 154 H 330" stroke="#475569" stroke-width="2" />
      <path d="M 360 248 H 330" stroke="#475569" stroke-width="2" />
      <path d="M 360 342 H 330" stroke="#475569" stroke-width="2" />

      <!-- ETAPA 4 a Leaves -->
      <path d="M 390 667 H 360" stroke="#475569" stroke-width="2" />
      <path d="M 360 518 V 800" stroke="#475569" stroke-width="2" />
      <path d="M 360 518 H 330" stroke="#475569" stroke-width="2" />
      <path d="M 360 612 H 330" stroke="#475569" stroke-width="2" />
      <path d="M 360 706 H 330" stroke="#475569" stroke-width="2" />
      <path d="M 360 800 H 330" stroke="#475569" stroke-width="2" />

      <!-- ETAPA 2 a Leaves -->
      <path d="M 1210 233 H 1240" stroke="#475569" stroke-width="2" />
      <path d="M 1240 60 V 342" stroke="#475569" stroke-width="2" />
      <path d="M 1240 60 H 1270" stroke="#475569" stroke-width="2" />
      <path d="M 1240 154 H 1270" stroke="#475569" stroke-width="2" />
      <path d="M 1240 248 H 1270" stroke="#475569" stroke-width="2" />
      <path d="M 1240 342 H 1270" stroke="#475569" stroke-width="2" />

      <!-- ETAPA 3 a Leaves -->
      <path d="M 1210 667 H 1240" stroke="#475569" stroke-width="2" />
      <path d="M 1240 518 V 800" stroke="#475569" stroke-width="2" />
      <path d="M 1240 518 H 1270" stroke="#475569" stroke-width="2" />
      <path d="M 1240 612 H 1270" stroke="#475569" stroke-width="2" />
      <path d="M 1240 706 H 1270" stroke="#475569" stroke-width="2" />
      <path d="M 1240 800 H 1270" stroke="#475569" stroke-width="2" />
    </g>

    <!-- ==============================================
         NODO CENTRAL (SIN SOMBRA)
         ============================================== -->
    <g transform="translate(695, 400)">
      <rect width="210" height="100" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2" />
      <text x="105" y="42" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="-0.02em" fill="#ffffff">Proceso de</text>
      <text x="105" y="68" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="-0.02em" fill="#ffffff">Negociación</text>
    </g>

    <!-- ==============================================
         INDICADORES DE FLUJO CÍCLICO
         ============================================== -->
    <!-- 1 -> 2 (Top) -->
    <g>
      <circle cx="800" cy="233" r="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
      <text x="800" y="233" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#0f172a">&#8594;</text>
    </g>

    <!-- 2 -> 3 (Right) -->
    <g>
      <circle cx="1107" cy="450" r="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
      <text x="1107" y="450" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#0f172a">&#8595;</text>
    </g>

    <!-- 3 -> 4 (Bottom) -->
    <g>
      <circle cx="800" cy="667" r="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
      <text x="800" y="667" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#0f172a">&#8592;</text>
    </g>

    <!-- 4 -> 1 (Left) -->
    <g>
      <circle cx="493" cy="450" r="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
      <text x="493" y="450" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#0f172a">&#8593;</text>
    </g>

    <!-- ================= ETAPA 1 ================= -->
    <g transform="translate(390, 190)">
      <rect width="206" height="86" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <text x="103" y="49" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Pre-Negociación</text>
      
      <!-- Badge de Etapa -->
      <circle cx="103" cy="0" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" />
      <text x="103" y="0" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="800" fill="#ffffff">1</text>
    </g>
  
    <!-- Context Box Etapa 1 -->
    <g transform="translate(390, 288)">
      <rect width="206" height="74" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
      <text x="103" y="17" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Antes de la plática, cada</text>
    <text x="103" y="32" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">quien piensa qué necesita,</text>
    <text x="103" y="47" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">qué busca y hasta dónde puede</text>
    <text x="103" y="62" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">ceder.</text>
    </g>

    <!-- Tarjeta: Concepto -->
    <g transform="translate(10, 16)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Concepto</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Es el tiempo antes de verse. Aquí cada uno</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">piensa qué quiere pedir y prepara una idea clara</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">para la otra persona.</text>
    </g>

    <!-- Tarjeta: Importancia -->
    <g transform="translate(10, 110)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Importancia</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Llegar listo evita sorpresas y malos ratos.</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">También da más confianza para conseguir un mejor</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">trato.</text>
    </g>

    <!-- Tarjeta: Características -->
    <g transform="translate(10, 204)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Características</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Pide buscar datos, saber con quién vas a hablar,</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">escuchar a tu gente y tener claro qué puedes</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">dar.</text>
    </g>

    <!-- Tarjeta: Factores Clave -->
    <g transform="translate(10, 298)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Factores Clave</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Llevarse bien desde antes, tratarse con</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">amabilidad y pedir cosas reales ayuda a cerrar</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">un buen acuerdo.</text>
    </g>

    <!-- ================= ETAPA 2 ================= -->
    <g transform="translate(1004, 190)">
      <rect width="206" height="86" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <text x="103" y="49" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Negociación Gruesa</text>
      
      <!-- Badge de Etapa -->
      <circle cx="103" cy="0" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" />
      <text x="103" y="0" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="800" fill="#ffffff">2</text>
    </g>
  
    <!-- Context Box Etapa 2 -->
    <g transform="translate(1004, 288)">
      <rect width="206" height="59" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
      <text x="103" y="17" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Las personas se juntan para</text>
    <text x="103" y="32" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">hablar de los puntos grandes</text>
    <text x="103" y="47" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">y ver qué busca cada lado.</text>
    </g>

    <!-- Tarjeta: Concepto -->
    <g transform="translate(1270, 16)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Concepto</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Es la primera plática cara a cara. Aquí se dicen</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">las cosas más importantes que busca cada lado.</text>
    </g>

    <!-- Tarjeta: Importancia -->
    <g transform="translate(1270, 110)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Importancia</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Sirve para entrar en confianza y que los dos</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">lados entiendan qué quiere el otro antes de ver</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">detalles.</text>
    </g>

    <!-- Tarjeta: Características -->
    <g transform="translate(1270, 204)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Características</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">El trato debe ser tranquilo, saber escuchar y</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">buscar salidas donde los dos ganen algo bueno.</text>
    </g>

    <!-- Tarjeta: Puntos a Favor -->
    <g transform="translate(1270, 298)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Puntos a Favor</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Ayuda a aclarar dudas rápido, hace fácil hablar</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">y permite que salgan buenas ideas para ambos.</text>
    </g>

    <!-- ================= ETAPA 3 ================= -->
    <g transform="translate(1004, 624)">
      <rect width="206" height="86" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <text x="103" y="49" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Negociación Fina</text>
      
      <!-- Badge de Etapa -->
      <circle cx="103" cy="0" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" />
      <text x="103" y="0" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="800" fill="#ffffff">3</text>
    </g>
  
    <!-- Context Box Etapa 3 -->
    <g transform="translate(1004, 722)">
      <rect width="206" height="74" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
      <text x="103" y="17" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Se arreglan las partes</text>
    <text x="103" y="32" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">difíciles y se afinan los</text>
    <text x="103" y="47" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">detalles para que el trato</text>
    <text x="103" y="62" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">sea parejo.</text>
    </g>

    <!-- Tarjeta: Concepto -->
    <g transform="translate(1270, 474)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Concepto</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Es el momento de ver los detalles. Se revisa</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">todo con cuidado para que no quede nada suelto.</text>
    </g>

    <!-- Tarjeta: Importancia -->
    <g transform="translate(1270, 568)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Importancia</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Sirve para arreglar lo que todavía falta y</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">lograr que el trato final quede claro y dure</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">mucho tiempo.</text>
    </g>

    <!-- Tarjeta: Características -->
    <g transform="translate(1270, 662)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Características</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Pide mucha paciencia, hablar con calma, fijarse</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">bien en lo que se acepta y saber aflojar un</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">poco.</text>
    </g>

    <!-- Tarjeta: Riesgos a Evitar -->
    <g transform="translate(1270, 756)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Riesgos a Evitar</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Si alguien se pone terco o no quiere escuchar,</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">la plática se puede romper y echar a perder lo</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">avanzado.</text>
    </g>

    <!-- ================= ETAPA 4 ================= -->
    <g transform="translate(390, 624)">
      <rect width="206" height="86" rx="14" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <text x="103" y="49" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Post-Negociación</text>
      
      <!-- Badge de Etapa -->
      <circle cx="103" cy="0" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" />
      <text x="103" y="0" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="800" fill="#ffffff">4</text>
    </g>
  
    <!-- Context Box Etapa 4 -->
    <g transform="translate(390, 722)">
      <rect width="206" height="59" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
      <text x="103" y="17" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Se anota el trato final y se</text>
    <text x="103" y="32" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">cuida que cada quien cumpla</text>
    <text x="103" y="47" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">lo que prometió.</text>
    </g>

    <!-- Tarjeta: Concepto -->
    <g transform="translate(10, 474)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Concepto</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Es lo que viene después del trato. Aquí se</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">firman los papeles y se empieza a hacer todo lo</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">pactado.</text>
    </g>

    <!-- Tarjeta: Importancia -->
    <g transform="translate(10, 568)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Importancia</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Asegura que nadie falle a su palabra y ayuda a</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">aprender para hacer tratos todavía mejores</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">después.</text>
    </g>

    <!-- Tarjeta: Características -->
    <g transform="translate(10, 662)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Características</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Consiste en vigilar que todo se haga a tiempo,</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">llevarse bien y resolver cualquier problema</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">nuevo.</text>
    </g>

    <!-- Tarjeta: Factores Clave -->
    <g transform="translate(10, 756)">
      <rect width="320" height="88" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
      <text x="14" y="25" font-size="12.5" font-weight="800" letter-spacing="-0.01em" fill="#0f172a">Factores Clave</text>
      <text x="14" y="43" font-size="11" font-weight="500" fill="#334155">Anotar todo de forma sencilla, cumplir las</text>
  <text x="14" y="58" font-size="11" font-weight="500" fill="#334155">fechas y seguir en contacto para que no haya</text>
  <text x="14" y="73" font-size="11" font-weight="500" fill="#334155">fallas.</text>
    </g>

  </g>
</svg>
