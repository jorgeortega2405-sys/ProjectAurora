<div class="component-wrapper component-wrapper--full view-wrapper tool-layout-wrapper" data-ref="download-ready-wrapper">
  <div class="tool-layout" data-ref="download-ready-layout">
    <main class="tool-layout__workspace" data-ref="download-ready-workspace">
      <div class="tool-workspace__canvas" data-ref="pdf-dropzone-card">
        <div class="tool-hero-dropzone" data-ref="pdf-dropzone">
          <h1 class="tool-hero-dropzone__title" data-ref="ready-title">¡Los PDFs se han unido!</h1>
          <p class="tool-hero-dropzone__desc" data-ref="ready-subtitle">El proceso se ha completado con éxito y tu documento está listo para descargar.</p>

          <div class="tool-hero-dropzone__actions tool-hero-dropzone__actions--ready" data-ref="ready-actions-group">
            <a class="component-button component-button--black tool-hero-dropzone__btn-select tool-hero-dropzone__btn-download" data-ref="btn-download-file" href="#" download>
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#download"></use></svg>
              <span data-ref="ready-btn-text">Descargar PDF</span>
            </a>
            <div class="tool-hero-dropzone__cloud-btns tool-hero-dropzone__cloud-btns--ready" data-ref="ready-action-btns">
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-save-drive" data-tooltip="Google Drive" aria-label="Google Drive">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#google_drive"></use></svg>
              </button>
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-save-dropbox" data-tooltip="Dropbox" aria-label="Dropbox">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#dropbox"></use></svg>
              </button>
              <button type="button" class="tool-hero-dropzone__cloud-btn" data-ref="btn-copy-link" data-tooltip="Copiar enlace de descarga" aria-label="Copiar enlace de descarga">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#content_copy"></use></svg>
              </button>
              <button type="button" class="tool-hero-dropzone__cloud-btn tool-hero-dropzone__cloud-btn--danger" data-ref="btn-delete-file" data-tooltip="Eliminar ahora" aria-label="Eliminar ahora">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#delete"></use></svg>
              </button>
            </div>
          </div>

          <div class="banner banner--danger" data-ref="ready-error" style="display: none; margin-top: 16px;"></div>

          <div class="tool-continue-panel" data-ref="continue-workflow-section">
            <div class="tool-continue-panel__header">
              <h2 class="tool-continue-panel__title">Continuar a...</h2>
            </div>
            <div class="tool-continue-panel__menu" data-ref="continue-workflow-grid"></div>
          </div>

          <div class="tool-thankyou-card" data-ref="thankyou-card">
            <div class="tool-thankyou-card__content">
              <h3 class="tool-thankyou-card__title">¿Cómo nos puedes dar las gracias? ¡Haz correr la voz!</h3>
              <p class="tool-thankyou-card__desc">Por favor, comparte la herramienta para inspirar a más personas productivas.</p>
              <div class="tool-thankyou-card__badges" data-ref="thankyou-badges">
                <button type="button" class="component-badge component-badge--interactive thankyou-badge thankyou-badge--trustpilot" data-ref="badge-trustpilot" aria-label="Trustpilot">
                  <svg class="component-badge__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 2l2.9 8.9h9.3l-7.5 5.5 2.9 8.9L12 19.8l-7.6 5.5 2.9-8.9L-.2 10.9h9.3L12 2z" fill="#00B67A"/>
                    <path d="M17.6 16.4l-5.6 3.4v-8.9l7.5-5.5h-9.3L12 2l2.9 8.9h9.3l-7.5 5.5 2.9 8.9-2-1.4z" fill="#005128"/>
                  </svg>
                  <span class="component-badge__text">Trustpilot</span>
                </button>
                <button type="button" class="component-badge component-badge--interactive thankyou-badge thankyou-badge--facebook" data-ref="badge-facebook" aria-label="Facebook">
                  <svg class="component-badge__icon" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                  </svg>
                  <span class="component-badge__text">Facebook</span>
                </button>
                <button type="button" class="component-badge component-badge--interactive thankyou-badge thankyou-badge--twitter" data-ref="badge-twitter" aria-label="Twitter (X)">
                  <svg class="component-badge__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                  </svg>
                  <span class="component-badge__text">Twitter (X)</span>
                </button>
                <button type="button" class="component-badge component-badge--interactive thankyou-badge thankyou-badge--linkedin" data-ref="badge-linkedin" aria-label="LinkedIn">
                  <svg class="component-badge__icon" viewBox="0 0 24 24" fill="#0A66C2" aria-hidden="true">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                  </svg>
                  <span class="component-badge__text">LinkedIn</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
