services:
  pdf:
    command: npm run dev
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=aurora_user
      - DB_PASSWORD=aurora_password
      - DB_NAME=db_aurora
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOWNLOADER_SERVICE_URL=http://downloader:4050
    volumes:
      - ./apps/pdf:/app
      - /app/node_modules
      - /app/dist

  admin:
    command: npm run dev
    environment:
      - NODE_ENV=development
      - ADMIN_PORT=3005
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=aurora_user
      - DB_PASSWORD=aurora_password
      - DB_NAME=db_aurora
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=aurora-storage
      - S3_FORCE_PATH_STYLE=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-flash-lite-latest
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - /app/dist
