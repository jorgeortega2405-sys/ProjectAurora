<div class="component-wrapper component-wrapper--full home-wrapper view-wrapper" data-ref="admin-education-wrapper">
  <header class="component-top" data-ref="component-top">
    <div class="component-top-left" data-ref="component-top-left">
      <h1 class="component-top-title" data-ref="education-page-title" style="font-size: 15px; font-weight: 700;">Verificación de Estudiantes</h1>
      <span class="component-badge component-badge--sm" data-ref="education-count-badge">0</span>
    </div>

    <div class="component-top-right" data-ref="component-top-right">
      <div class="component-top-actions" data-ref="education-default-actions" style="display: flex; align-items: center; gap: 8px;">
        <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-toggle-search" data-tooltip="Buscar solicitudes" data-tooltip-placement="bottom" aria-label="Buscar solicitudes">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
        </button>
      </div>

      <div class="component-top-actions" data-ref="education-selected-actions" style="display: none; align-items: center; gap: 8px;">
        <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-action-deselect" data-tooltip="Cancelar selección" data-tooltip-placement="bottom" aria-label="Cancelar selección">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
        </button>

        <button type="button" class="component-button component-button--h36 component-button--icon-only" data-ref="btn-action-view-doc" data-tooltip="Ver comprobante original" data-tooltip-placement="bottom" aria-label="Ver comprobante original">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#visibility"></use></svg>
        </button>

        <button type="button" class="component-button component-button--h36 component-button--icon-only component-button--black" data-ref="btn-action-review" data-tooltip="Revisar solicitud académica" data-tooltip-placement="bottom" aria-label="Revisar solicitud académica">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#rate_review"></use></svg>
        </button>
      </div>
    </div>

    <div class="component-search-toolbar is-hidden" data-ref="search-toolbar">
      <div class="component-search component-search--full" data-ref="search-box">
        <div class="component-search__icon" data-ref="search-icon">
          <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
        </div>
        <div class="component-search__input-box" data-ref="search-input-box">
          <input class="component-search__input" data-ref="education-search-input" placeholder="Buscar por estudiante, correo o institución..." type="text" maxlength="100" autocomplete="off" />
        </div>
        <button type="button" class="component-button component-button--h34 component-button--icon-only" data-ref="btn-clear-search" aria-label="Limpiar búsqueda" style="display: none; margin-right: 4px;">
          <svg class="component-icon" aria-hidden="true" style="width: 16px; height: 16px;"><use href="/icons.svg#close"></use></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="component-bottom component-bottom--no-padding" data-ref="component-bottom">
    <div class="component-table-wrapper" data-ref="education-table-wrapper">
      <table class="component-table" data-ref="education-table">
        <thead class="component-table__head" data-ref="education-thead">
          <tr>
            <th class="th-student" data-ref="th-student" style="width: 28%;">Estudiante</th>
            <th class="th-email" data-ref="th-email" style="width: 24%;">Correo Electrónico</th>
            <th class="th-school" data-ref="th-school" style="width: 24%;">Institución</th>
            <th class="th-document" data-ref="th-document" style="width: 12%;">Comprobante</th>
            <th class="th-status" data-ref="th-status" style="width: 12%;">Estado</th>
          </tr>
        </thead>
        <tbody class="component-table__body" data-ref="education-tbody">
          <tr>
            <td colspan="5" style="text-align: center; padding: 48px 16px; color: var(--text-secondary);">Cargando solicitudes de verificación...</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="banner banner--danger" data-ref="education-page-error" style="display: none; margin: 12px 24px;"></div>
  </div>

  <div class="modal-backdrop" data-ref="modal-review-backdrop" style="display: none;">
    <div class="modal-container" data-ref="modal-review-container">
      <button type="button" class="modal-close-btn" data-ref="btn-close-modal-review" aria-label="Cerrar modal">
        <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
      </button>

      <div class="modal-card modal-card--w-480" data-ref="card-modal-review">
        <div class="modal-card__header" data-ref="header-modal-review">
          <h2 class="modal-card__title" data-ref="title-modal-review">Revisar Verificación Académica</h2>
          <p class="modal-card__desc" data-ref="desc-modal-review">Valida el comprobante y define si el estudiante recibe el tier educativo gratuito.</p>
        </div>

        <div class="modal-card__body" data-ref="body-modal-review" style="display: flex; flex-direction: column; gap: 14px;">
          <div class="admin-card" data-ref="preview-student-info" style="padding: 14px; gap: 6px;">
            <strong data-ref="modal-student-name" style="font-size: 14px; color: var(--text-primary);">Estudiante</strong>
            <span data-ref="modal-student-school" style="font-size: 12.5px; color: var(--text-secondary);">Escuela</span>
            <div style="margin-top: 8px;">
              <a class="component-button component-button--h34 component-button--outline" data-ref="link-view-document" href="#" target="_blank" rel="noopener noreferrer">
                <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#visibility"></use></svg>
                <span>Ver documento original</span>
              </a>
            </div>
          </div>

          <label class="field" data-ref="field-admin-notes">
            <input class="field__input" data-ref="input-admin-notes" type="text" placeholder=" " maxlength="200" autocomplete="off" />
            <span class="field__label" data-ref="label-admin-notes">Notas administrativas (opcional)</span>
          </label>

          <div style="display: flex; gap: 10px; margin-top: 8px;">
            <button type="button" class="component-button component-button--h44 component-button--black" data-ref="btn-confirm-approve" style="flex: 1; background-color: var(--color-success); border-color: var(--color-success);">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#check"></use></svg>
              <span>Aprobar Estudiante</span>
            </button>
            <button type="button" class="component-button component-button--h44 component-button--outline" data-ref="btn-confirm-reject" style="flex: 1; color: var(--action-danger); border-color: var(--action-danger);">
              <svg class="component-icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg>
              <span>Rechazar</span>
            </button>
          </div>

          <div class="banner banner--danger" data-ref="modal-review-error" style="display: none; margin-top: 8px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
